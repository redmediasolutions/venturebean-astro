# Rebuilds the website on Cloudflare every morning, so blog posts scheduled in
# the Content Manager appear on their date (posts publish at 10:00 AM IST).
#
# Setup (once):
#   1. Cloudflare → your site → Settings → Builds → Deploy hooks → Add deploy hook
#      (branch: deployment). Copy the URL.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions →
#      New repository secret: name CLOUDFLARE_DEPLOY_HOOK, value = that URL.
#
# GitHub only runs scheduled workflows from the default branch (main), so this
# file must be on main too. "Run workflow" on the Actions tab rebuilds right away.
name: Daily website rebuild

on:
  schedule:
    - cron: '45 4 * * *' # 10:15 AM IST every day
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Add the CLOUDFLARE_DEPLOY_HOOK secret (see the top of this file)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
